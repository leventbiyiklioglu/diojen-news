<main class="sayfa">

<section id="giris" class="kutu" style="margin-top:20px" hidden><h2>Muhabir girişi</h2><p>Kayıtlı muhabir e-postanı yaz.</p>
 <input id="eposta" type="email" placeholder="muhabir@diojennews.com"><button class="btn" id="gonder">Giriş bağlantısı gönder</button><p id="giris-mesaj" class="oturum"></p></section>
<section id="panel" hidden>
 <div class="kart" style="padding:26px;margin-bottom:28px"><h2 style="font-family:Georgia,serif;margin:0 0 8px">Yeni yazı gönder</h2>

  <input type="file" id="dosya" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="margin:10px 0">
  <select id="tur" style="padding:10px;border-radius:10px;margin:0 8px 10px 0"><option value="muhabir">Muhabir haberi</option><option value="kose">Köşe yazısı</option><option value="is-dunyasi">İş dünyası analizi</option></select>

 <h2 style="font-family:Georgia,serif">Gönderilerim</h2><div class="izgara" id="liste"></div>
